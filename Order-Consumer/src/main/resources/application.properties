spring.application.name=Order-Consumer

server.port=8082

# ===============================
# Kafka Consumer
# ===============================
spring.kafka.bootstrap-servers=localhost:9092

spring.kafka.consumer.group-id=order-consumer-group
spring.kafka.consumer.auto-offset-reset=earliest

spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer

spring.kafka.consumer.properties.spring.json.trusted.packages=com.humancloud.event
spring.kafka.consumer.properties.spring.json.value.default.type=com.humancloud.event.OrderCreatedEvent


# ===============================
# MySQL
# ===============================
spring.datasource.url=jdbc:mysql://localhost:3306/kafka
spring.datasource.username=root
spring.datasource.password=112233
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===============================
# JPA
# ===============================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

#to perform batch insertion
spring.kafka.listener.type=batch
spring.kafka.consumer.max-poll-records=10
spring.kafka.consumer.fetch-min-size=1024
spring.kafka.consumer.fetch-max-wait=1000

spring.jpa.properties.hibernate.jdbc.batch_size=10
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true